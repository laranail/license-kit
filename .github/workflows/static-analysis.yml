name: Static analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: Pint · PHPStan · Rector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, sodium
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Pint (lint)
        run: vendor/bin/laranail-pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar
