# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # codeql-action/init and /analyze MUST move together: CodeQL fails with
      # "Loaded a configuration file for version X, but running version Y" when
      # they differ, and dependabot proposes each subpath as its own pull
      # request -- so each one alone is red. Grouping keeps them in one commit.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
